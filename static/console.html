<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>控制台 · OneShot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2032%2032%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20x%3D%22.5%22%20y%3D%22.5%22%20width%3D%2231%22%20height%3D%2231%22%20rx%3D%227.5%22%20fill%3D%22%23242429%22%20stroke%3D%22%234a4a52%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%229%22%20fill%3D%22none%22%20stroke%3D%22%23ededf0%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M14%2011.6v8.8l6.8-4.4z%22%20fill%3D%22%23ededf0%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="/static/shared/type.css?v=1">
<style>
:root { --bg: #0b0b0c; --panel: #141417; --card: #18181b; --line: #2a2a2e; --line2: #3a3a40; --text: #ededf0; --dim: #8b8b93; --faint: #5d5d65;
  --success: #d6d6dc; --red: #ff5d5d; --yellow: #ffcf5a; --blue: #5b8cff; --accent: #222226; }
* { box-sizing: border-box; }
html { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);  }
* { scrollbar-width: thin; scrollbar-color: #3a3a40 transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.app { display: flex; height: 100%; }
nav { width: 216px; flex: none; border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; background: #0e0e10; }
nav .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: var(--fs-heading); padding: 2px 8px 18px; }
nav .logo span { width: 30px; height: 30px; display: inline-flex; }
nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: #c8c8ce; text-decoration: none; }
nav a:hover { background: #1a1a1d; } nav a.on { background: #222226; color: #fff; }
nav .sec { color: var(--faint); font-size: var(--fs-caption); padding: 14px 10px 4px; }
nav .grow { flex: 1; }
nav .me { padding: 10px; border-top: 1px solid var(--line); color: var(--dim); font-size: var(--fs-small); }
nav .me b { color: var(--text); display: block; }
main { flex: 1; overflow-y: auto; padding: 26px 32px 60px; }
h1 { font-size: var(--fs-title); margin: 0 0 4px; } .lead { color: var(--dim); margin: 0 0 20px; font-size: var(--fs-body); }
h2 { font-size: var(--fs-heading); margin: 26px 0 10px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; } .grow { flex: 1; }
.btn { background: #1d1d21; border: 1px solid var(--line2); border-radius: 10px; padding: 7px 13px; color: #e2e2e6; white-space: nowrap; }
.btn:hover { border-color: #666; } .btn.pri { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
.btn.grad { background: var(--accent); color: var(--text); border: 1px solid var(--line2); font-weight: 600; }
.btn.danger { color: #ff8a8a; } .btn.sm { padding: 4px 9px; font-size: var(--fs-small); border-radius: 8px; }
.btn:disabled { opacity: .4; cursor: default; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.grid { display: grid; gap: 14px; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 9px; font-size: var(--fs-caption); background: #222226; color: #cfcfd5; }
.tag.ok { background: #242429; color: var(--success); } .tag.bad { background: #351a1a; color: #ff8a8a; } .tag.run { background: #33301a; color: var(--yellow); }
.tag.loc { background: #1b2a3a; color: #8fc3ff; }
.dim { color: var(--dim); } .faint { color: var(--faint); font-size: var(--fs-small); }
table { width: 100%; border-collapse: collapse; font-size: var(--fs-body); }
th { text-align: left; color: var(--dim); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: var(--fs-small); }
td { padding: 9px 10px; border-bottom: 1px solid #1d1d20; vertical-align: top; }
tr:hover td { background: #121214; }
input.in, select.in, textarea.in { background: #111113; border: 1px solid var(--line2); border-radius: 9px; padding: 7px 10px; width: 100%; }
select.in { padding: 6px 8px; }
label.f { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 10px; margin: 8px 0; color: var(--dim); font-size: var(--fs-small); }
.toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: #fff; color: #000; padding: 9px 16px; border-radius: 11px; font-weight: 500; opacity: 0; transition: .2s; pointer-events: none; z-index: 99; }
.toast.on { opacity: 1; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 50; }
.modal.on { display: flex; }
.modal .box { width: min(620px, 94vw); max-height: 90vh; overflow-y: auto; background: #18181b; border: 1px solid var(--line2); border-radius: 16px; padding: 18px 20px; }
.modal h3 { margin: 0 0 12px; font-size: var(--fs-heading); }
/* projects */
.projects { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.pj { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
.pj:hover { border-color: #555; }
.pj .cv { aspect-ratio: 16/9; background: #0e0e10 center/cover no-repeat; position: relative; display: flex; align-items: center; justify-content: center; color: var(--faint); }
.pj .cv { overflow: hidden; } .pj .cv video, .pj .cv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pj .bd { padding: 10px 12px; } .pj .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pj .mt { color: var(--faint); font-size: var(--fs-small); display: flex; gap: 8px; margin-top: 2px; }
.pj .acts { display: flex; gap: 4px; padding: 0 10px 10px; }
.newcards { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin-bottom: 8px; }
.nc { border-radius: 14px; padding: 16px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); }
.nc.grad { background: var(--accent); border: 1px solid var(--line2); color: var(--text); }
.nc b { display: block; font-size: var(--fs-heading); } .nc small { opacity: .8; }
/* services */
.caps { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
.cap .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; } .cap .hd b { font-size: var(--fs-heading); }
.rt { display: grid; grid-template-columns: 34px 1fr 150px 24px; gap: 6px; align-items: center; margin: 5px 0; }
.rt .no { color: var(--faint); font-size: var(--fs-small); text-align: center; }
.rt .x { border: none; background: none; color: var(--faint); } .rt .x:hover { color: var(--red); }
.prov { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.prov .caps2 { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.catalog { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.catalog .ci { border: 1px solid var(--line2); border-radius: 12px; padding: 12px; cursor: pointer; background: #141417; }
.catalog .ci:hover { border-color: #888; }
/* local */
.stats { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.meter { height: 6px; border-radius: 4px; background: #222; overflow: hidden; margin-top: 6px; } .meter i { display: block; height: 100%; background: var(--blue); }
.svc { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #1d1d20; }
.svc:last-child { border: none; }
.big { font-size: var(--fs-title); font-weight: 600; }

/* ---------- canvas look (same tokens and components as the canvas page) */
:root { --panel: rgba(24,24,27,.94); --card: #151517; --card-hi: #1c1c1f; }
::-webkit-scrollbar { width: 8px; height: 8px; background: transparent; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: #3a3a40; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
html, body { font-size: var(--fs-body); -webkit-font-smoothing: antialiased; }
body { background-color: var(--bg); background-image: radial-gradient(rgba(255,255,255,.075) 1.1px, transparent 1.3px); background-size: 22px 22px; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.app { padding: 14px; gap: 14px; }
nav { width: 214px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 12px 40px rgba(0,0,0,.45); backdrop-filter: blur(10px); padding: 10px 8px; }
nav .logo { padding: 4px 8px 14px; font-size: var(--fs-heading); } nav .logo span { width: 28px; height: 28px; }
nav a { padding: 7px 10px; border-radius: 9px; color: #dcdce2; }
nav a svg.i { color: #9a9aa2; } nav a:hover { background: rgba(255,255,255,.07); } nav a.on { background: rgba(255,255,255,.12); color: #fff; } nav a.on svg.i { color: #fff; }
nav .sec { font-size: var(--fs-caption); padding: 12px 10px 4px; }
nav .me { border-top: 1px solid var(--line); margin: 6px 2px 0; }
main { padding: 12px 18px 60px; }
.card, .pj, .nc { background: var(--card); border-color: var(--line); border-radius: 16px; transition: border-color .15s, box-shadow .15s; }
.pj:hover, .nc:not(.grad):hover, .catalog .ci:hover { border-color: rgba(255,255,255,.55); box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 10px 40px rgba(0,0,0,.5); }
.nc.grad { border: 1px solid var(--line2); } .nc.grad:hover { filter: brightness(1.08); }
.btn { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px; border-radius: 9px; background: #222226; border: 1px solid transparent; color: #d6d6dc; font-size: var(--fs-small); }
.btn:hover { border-color: var(--line2); } .btn.pri { background: #fff; color: #000; border-color: #fff; } .btn.pri:hover { background: #e8e8ec; }
.btn.sm { height: 26px; padding: 0 9px; font-size: var(--fs-small); border-radius: 8px; }
.btn.grad { border: 1px solid var(--line2); } .btn.grad:hover { filter: brightness(1.08); }
input.in, select.in, textarea.in { background: #111113; border: 1px solid var(--line2); border-radius: 9px; outline: none; }
input.in:focus, select.in:focus, textarea.in:focus { border-color: #77777f; }
.tag { border-radius: 7px; background: #222226; }
.catalog .ci { background: var(--card); border-color: var(--line); border-radius: 14px; }
table { background: var(--card); border: 1px solid var(--line); border-radius: 16px; border-collapse: separate; border-spacing: 0; overflow: hidden; }
.card table { background: none; border: none; border-radius: 0; }
th { background: transparent; } tr:last-child td { border-bottom: none; } tr:hover td { background: var(--card-hi); }
.modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 16px 50px rgba(0,0,0,.55); backdrop-filter: blur(10px); }
.toast { top: 18px; bottom: auto; padding: 7px 14px; border-radius: 10px; font-size: var(--fs-body); box-shadow: 0 8px 30px rgba(0,0,0,.4); }
.meter { background: #26262b; }

</style>

<body>
<div class="app">
  <nav>
    <div class="logo"><span><svg viewBox="0 0 32 32" width="100%" height="100%" aria-hidden="true"><rect x=".5" y=".5" width="31" height="31" rx="7.5" fill="#242429" stroke="#4a4a52"/><circle cx="16" cy="16" r="9" fill="none" stroke="#ededf0" stroke-width="2"/><path d="M14 11.6v8.8l6.8-4.4z" fill="#ededf0"/></svg></span>OneShot</div>
    <a href="#projects" data-p="projects"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M3.5 9h17M8 4.5 10 9M14 4.5 16 9"/></svg>项目</a>
    <a href="#tasks" data-p="tasks"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg>任务中心</a>
    <div class="sec admin">管理</div>
    <a href="#services" data-p="services" class="admin"><svg class="i" viewBox="0 0 24 24"><path d="M9 3v4M15 3v4M7 7h10v4a5 5 0 0 1-10 0zM12 16v5"/></svg>模型与服务</a>
    <a href="#local" data-p="local" class="admin"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="11" rx="2.5"/><path d="M8.5 19.5h7M12 15.5v4"/></svg>本地部署</a>
    <a href="#members" data-p="members" class="admin"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 6.2a3 3 0 0 1 0 5.6M17.5 14.5a5 5 0 0 1 3 4.5"/></svg>成员</a>
    <div class="grow"></div>
    <a href="#account" data-p="account"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>我的账号</a>
    <div class="interface-language"><select data-interface-language aria-label="界面语言"><option value="zh-CN" lang="zh-CN">中文</option><option value="en" lang="en">English</option></select><span data-language-status role="status"></span></div>
    <div class="me" id="me"></div>
  </nav>
  <main id="main"></main>
</div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const tr = OneShotI18n.t;
OneShotI18n.beforeSwitch(() => !document.querySelector("#modal.on, .cap [data-save][style='']") && !document.querySelector("#o")?.value && !document.querySelector("#n")?.value);
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = (m, ms = 2600) => { const t = $("#toast"); t.textContent = tr(m); t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), ms); };
async function api(path, body, method) {
  const r = await fetch(path, { method: method || (body ? "POST" : "GET"), headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.href = "/login?next=" + encodeURIComponent(location.pathname + location.hash); throw new Error("请先登录"); }
  const t = await r.text(); let j; try { j = JSON.parse(t); } catch { j = { error: t }; }
  if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
const ago = t => {
  if (!t) return "";
  const seconds = Date.now() / 1000 - t;
  if (seconds < 60) return tr("刚刚");
  if (seconds < 3600) return tr("{count} 分钟前", {count:Math.round(seconds / 60)});
  if (seconds < 86400) return tr("{count} 小时前", {count:Math.round(seconds / 3600)});
  return new Date(t * 1000).toLocaleDateString(OneShotI18n.locale);
};
const fmtS = s => s == null ? "" : s >= 90 ? tr("{count} 分钟",{count:(s / 60).toFixed(1)}) : tr("{seconds} 秒",{seconds:Math.round(s)});
const gb = b => (b / 1e9).toFixed(b > 1e11 ? 0 : 1) + " GB";
const CAPN = { text: "文本", vision: "看图", image: "生图", video: "视频", tts: "配音", music: "配乐", sfx: "音效", seed_audio: "参考音频生成", asr: "语音转写", audio_separation: "人声分离", search: "网页搜索" };
const modal = html => { $("#mbox").innerHTML = html; $("#modal").classList.add("on"); return $("#mbox"); };
const closeModal = () => $("#modal").classList.remove("on");
$("#modal").addEventListener("pointerdown", e => { if (e.target.id === "modal") closeModal(); });
let ME = null, timer = null;

// ============================================================ tasks
async function pgTasks() {
  const all = ME.role === "admin" && localStorage.getItem("c.allt") === "1";
  const days = +(localStorage.getItem("c.days") || 7);
  const r = await api(`/api/tasks?days=${days}${all ? "&all=1" : ""}`);
  const st = s => s === "done" ? OneShotI18n.html`<span class="tag ok">完成</span>` : s === "error" ? OneShotI18n.html`<span class="tag bad">失败</span>` : s === "running" ? OneShotI18n.html`<span class="tag run">进行中</span>` : OneShotI18n.html`<span class="tag">排队</span>`;
  const n = r.tasks.length, ok = r.tasks.filter(t => t.state === "done").length, bad = r.tasks.filter(t => t.state === "error").length;
  const cost = r.totals.reduce((a, t) => a + (t.cost || 0), 0);
  $("#main").innerHTML = OneShotI18n.html`<h1>任务中心</h1><p class="lead">所有生成任务：用了哪个模型、花了多久、为什么失败。</p>
    <div class="row" style="margin-bottom:14px">
      <select class="in" id="days" style="width:auto">${[1, 7, 30, 90].map(d => `<option value="${d}" ${d === days ? "selected" : ""}>${tr("最近 {days} 天",{days:d})}</option>`).join("")}</select>
      ${ME.role === "admin" ? OneShotI18n.html`<label class="dim"><input type="checkbox" id="allt" ${all ? "checked" : ""}> 全部成员</label>` : ""}
      <span class="grow"></span><button class="btn" id="rf">刷新</button></div>
    <div class="grid stats" style="margin-bottom:16px">
      <div class="card"><div class="dim">任务</div><div class="big">${n}</div></div>
      <div class="card"><div class="dim">成功 / 失败</div><div class="big"><span style="color:var(--success)">${ok}</span> / <span style="color:#ff8a8a">${bad}</span></div></div>
      <div class="card"><div class="dim">按服务</div>${r.totals.slice(0, 5).map(t => `<div class="row" style="font-size:var(--fs-small)"><span>${esc(t.provider)} · ${tr(CAPN[t.capability] || t.capability)}</span><span class="grow"></span><span class="dim">${tr("{count} 次",{count:t.n})} · ${fmtS(t.secs)}</span></div>`).join("") || `<div class="faint">—</div>`}</div>
      <div class="card"><div class="dim">第三方费用（已记录的）</div><div class="big">${cost ? "¥" + cost.toFixed(2) : "—"}</div><div class="faint">本地 GPU 不计费</div></div>
    </div>
    <div class="card" style="padding:4px 6px"><table><thead><tr><th>时间</th>${all ? OneShotI18n.markup("<th>成员</th>") : ""}<th>内容</th><th>类型</th><th>服务 / 模型</th><th>状态</th><th>耗时</th></tr></thead><tbody>
    ${r.tasks.map(t => `<tr><td class="dim" title="${new Date(t.created * 1000).toLocaleString(OneShotI18n.locale)}">${ago(t.created)}</td>${all ? `<td>${esc(t.user || "")}</td>` : ""}
      <td>${t.board_id ? `<a href="/?board=${esc(t.board_id)}">${esc(t.label || "")}</a>` : esc(t.label || "")}${t.outputs?.length ? OneShotI18n.html` <a class="faint" href="/media?ref=${encodeURIComponent(t.outputs[0])}" target="_blank">查看</a>` : ""}</td>
      <td>${tr(CAPN[t.capability] || t.capability || "")}</td><td>${esc(t.provider || "")}<div class="faint">${esc(t.model || "")}</div></td>
      <td>${st(t.state)}${t.error ? `<div class="faint" style="color:#ff9a9a;max-width:320px">${esc(t.error)}</div>` : ""}${t.eta ? OneShotI18n.html`<div class="faint">还要约 ${fmtS(t.eta)}</div>` : ""}</td>
      <td class="dim">${fmtS(t.seconds)}</td></tr>`).join("") || OneShotI18n.html`<tr><td colspan="7" class="dim">这段时间没有任务</td></tr>`}</tbody></table></div>`;
  $("#days").onchange = e => { localStorage.setItem("c.days", e.target.value); pgTasks(); };
  $("#allt")?.addEventListener("change", e => { localStorage.setItem("c.allt", e.target.checked ? "1" : "0"); pgTasks(); });
  $("#rf").onclick = pgTasks;
  if (r.tasks.some(t => t.state === "running" || t.state === "queued")) timer = setTimeout(() => location.hash === "#tasks" && pgTasks(), 5000);
}

// ============================================================ services
let SV = null;
async function pgServices() {
  SV = await api("/api/admin/providers");
  const P = Object.fromEntries(SV.providers.map(p => [p.id, p]));
  const capCards = Object.entries(SV.caps).map(([cap, label]) => {
    const rts = SV.routes[cap] || [], opts = SV.providers.filter(p => p.enabled && p.caps.includes(cap));
    return OneShotI18n.html`<div class="card cap" data-cap="${cap}"><div class="hd"><b>${tr(CAPN[cap])}</b><span class="dim" style="font-size:var(--fs-small)">${esc(label.replace(/^[^（]+/, ""))}</span></div>
      ${rts.map((r, i) => OneShotI18n.html`<div class="rt" data-i="${i}"><span class="no">${i ? "备" + i : "默认"}</span>
          <select class="in" data-k="provider_id">${opts.map(p => `<option value="${p.id}" ${p.id === r.provider_id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>

    ${cat.caps.some(c=>["image","video"].includes(c))?OneShotI18n.html`<label class="f">生成费用参考（人民币）
      <textarea class="in" id="generationRates" rows="3" maxlength="8000">${esc(Object.entries(p.config.generation_rates || {}).map(([key,value])=>key+" "+value).join("\n"))}</textarea>
      <span class="faint">每行一项。图片填 image 模型名 每张费用。视频填 video 模型名 档位 每秒费用，档位为 std、hd、480p 或 4k。${p.kind==="minimax"?" 云端 H3 可用相同格式增填 video-input（每秒参考视频）、video-image（每张超额参考图）和 video-ref（MG 参考模式每秒成片）。":""} 单价未知时留空。</span></label>`:""}
    <label class="f">状态<select class="in" id="pe"><option value="1" ${p.enabled ? "selected" : ""}>启用</option><option value="0" ${!p.enabled ? "selected" : ""}>停用</option></select></label>
    <div class="row" style="margin-top:16px">${isNew ? "" : OneShotI18n.html`<button class="btn danger" id="pdel">删除</button>`}<span class="grow"></span><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" id="psave">保存并测试</button></div>
    <div class="faint" id="pmsg" style="margin-top:8px"></div>`);
  $("#psave", box).onclick = async () => {
    const config = { models: {} }, secrets = {};
    const rates = $("#generationRates", box);

    const endpointModels = $("#videoEndpointModels", box);
    if (endpointModels) config.video_endpoint_models = endpointModels.value;
    $$("[data-f]", box).forEach(i => i.dataset.secret ? (i.value.trim() && (secrets[i.dataset.f] = i.value.trim())) : (config[i.dataset.f] = i.value.trim()));
    $$("[data-m]", box).forEach(i => i.value.trim() && (config.models[i.dataset.m] = i.value.trim()));

}

    };
  };
  $$("tr[data-id] [data-a]").forEach(b => b.onclick = async () => {
    const id = b.closest("tr").dataset.id, u = us.find(x => x.id == id), a = b.dataset.a;
    if (a === "pw") {
      const pw = Math.random().toString(36).slice(2, 6) + Math.random().toString(36).slice(2, 8);
      const box = modal(OneShotI18n.html`<h3>重置 ${esc(u.name || u.username)} 的密码</h3><label class="f">新密码<input class="in" id="pw" value="${pw}"></label><div class="faint">对方会被退出登录，用新密码重新登录。</div>
        <div class="row" style="margin-top:14px"><span class="grow"></span><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" id="ok">重置</button></div>`);
      return $("#ok", box).onclick = async () => { try { await api("/api/admin/users/" + id, { password: $("#pw", box).value }, "PUT"); closeModal(); toast(OneShotI18n.t("密码已重置")); } catch (e) { toast(e.message); } };
    }
    try { await api("/api/admin/users/" + id, a === "role" ? { role: u.role === "admin" ? "member" : "admin" } : { disabled: !u.disabled }, "PUT"); pgMembers(); } catch (e) { toast(e.message); }
  });
}

// ============================================================ account
function pgAccount() {
  $("#main").innerHTML = OneShotI18n.html`<h1>我的账号</h1><p class="lead">${esc(ME.name || ME.username)} · ${tr(ME.role === "admin" ? "管理员" : "成员")}</p>
    <div class="card" style="max-width:460px"><b>修改密码</b>
      <label class="f">原密码<input class="in" type="password" id="o" autocomplete="current-password"></label>
      <label class="f">新密码<input class="in" type="password" id="n" autocomplete="new-password" placeholder="至少 8 位"></label>
      <div class="row"><span class="faint" id="m"></span><span class="grow"></span><button class="btn pri" id="ok">修改</button></div></div>
    <div style="margin-top:20px"><button class="btn danger" id="out">退出登录</button></div>`;
  $("#ok").onclick = async () => { try { await api("/api/me/password", { old: $("#o").value, new: $("#n").value }); toast(OneShotI18n.t("密码已修改")); $("#o").value = $("#n").value = ""; } catch (e) { $("#m").innerHTML = `<span style="color:#ff8a8a">${esc(e.message)}</span>`; } };
  $("#out").onclick = async () => { await api("/api/auth/logout", {}); location.href = "/login"; };
}

// ============================================================ router
const PAGES = { projects: pgProjects, tasks: pgTasks, services: pgServices, local: pgLocal, members: pgMembers, account: pgAccount };
async function route() {
  clearTimeout(timer);
  closeModal();
  let p = (location.hash || "#projects").slice(1);
  if (!PAGES[p] || (["services", "local", "members"].includes(p) && ME.role !== "admin")) p = "projects";
  if (p !== "projects") consoleCanvasDirectory = null;
  $$("nav a").forEach(a => a.classList.toggle("on", a.dataset.p === p));
  try { await PAGES[p](); } catch (e) { $("#main").innerHTML = OneShotI18n.html`<h1>出错了</h1><p class="dim">${esc(e.message)}</p>`; }
}
(async () => {
  ME = await api("/api/me");
  $$(".admin").forEach(el => el.style.display = ME.role === "admin" ? "" : "none");
  $("#me").innerHTML = OneShotI18n.html`<b>${esc(ME.name || ME.username)}</b>${tr(ME.role === "admin" ? "管理员" : "成员")} · <a href="/" style="color:var(--dim)">打开画布</a>`;
  addEventListener("hashchange", route); route();
})();
</script>
</body>
