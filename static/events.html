<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>创作活动 · OneShot</title>
  <link rel="stylesheet" href="/static/public/showcase.css?v=2">
  <link rel="stylesheet" href="/static/public/events.css?v=2">
  <script type="module" src="/static/public/events.mjs?v=3"></script>
<link rel="stylesheet" href="/static/shared/i18n.css?v=1">
<script src="/static/shared/locales/en-workspace.js?v=1"></script>
<script src="/static/shared/locales/en-pages.js?v=1"></script>
<script src="/static/shared/locales/en-workflows.js?v=2"></script>
<script src="/static/shared/locales/en-canvas-actions.js?v=1"></script>
</head>
<body>
  <header class="showcase-top">
    <a href="/events">OneShot · 创作活动</a>
    <nav aria-label="活动导航"><a href="/showcase">成片展映</a><a href="/">返回工作台</a></nav>
  <div class="interface-language interface-language--public"><select data-interface-language aria-label="界面语言"><option value="zh-CN" lang="zh-CN">中文</option><option value="en" lang="en">English</option></select><span data-language-status role="status"></span></div></header>
  <main>
    <h1 id="eventTitle">创作活动</h1>
    <p id="eventStatus" role="status">正在读取活动…</p>
    <section id="eventContent"></section>
    <form id="eventCreate" hidden>
      <h2>发布活动</h2>
      <label>名称<input name="title" maxlength="120" required></label>
      <label>主题简介<textarea name="brief" maxlength="1000" required></textarea></label>
      <label>详细规则<textarea name="rules" maxlength="5000" rows="4" required></textarea></label>
      <label>评审标准（选填）<textarea name="criteria" maxlength="2000" rows="2"></textarea></label>
      <label>奖项与奖品（选填）<textarea name="prizes" maxlength="2000" rows="2"></textarea></label>
      <div class="event-fields">
        <label>投稿开始<input name="starts" type="datetime-local" required></label>
        <label>投稿截止<input name="closes" type="datetime-local" required></label>
        <label>每人最多投稿<input name="slots" type="number" min="1" max="20" value="1" required></label>
        <label>最短秒数<input name="min_seconds" type="number" min=".1" step=".1"></label>
        <label>最长秒数<input name="max_seconds" type="number" min=".1" step=".1"></label>
      </div>
      <label>赛道（每行一个，选填）<textarea name="tracks" rows="2"></textarea></label>
      <label class="event-check"><input name="registration" type="checkbox">投稿前须报名并通过审核</label>
      <button>发布活动</button>
    </form>
  </main>
<script src="/static/shared/i18n.js?v=1"></script>
</body>
</html>
