<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成片展映 · OneShot</title>
  <link rel="stylesheet" href="/static/public/showcase.css?v=4">
  <script defer src="/static/public/showcase.js?v=6"></script>
<link rel="stylesheet" href="/static/shared/i18n.css?v=1">
<script src="/static/shared/locales/en-workspace.js?v=1"></script>
<script src="/static/shared/locales/en-pages.js?v=1"></script>
<script src="/static/shared/locales/en-workflows.js?v=2"></script>
<script src="/static/shared/locales/en-canvas-actions.js?v=1"></script>
</head>
<body>
  <header class="showcase-top">
    <a href="/showcase">OneShot · 成片展映</a>
    <nav aria-label="展映导航">
      <a href="/events">创作活动</a>
      <a id="myShowcaseLink" href="/showcase?mine=1" hidden>我的作品</a>
      <a id="reviewLink" href="/showcase?review=1" hidden>审核作品</a>
      <a href="/">返回工作台</a>
    </nav>
  <div class="interface-language interface-language--public"><select data-interface-language aria-label="界面语言"><option value="zh-CN" lang="zh-CN">中文</option><option value="en" lang="en">English</option></select><span data-language-status role="status"></span></div></header>
  <main>
    <h1 id="showcaseTitle">成片展映</h1>
    <a id="creatorProfile" hidden>查看我的公开主页</a>
    <form id="showcaseSearch">
      <input type="search" name="q" aria-label="搜索作品" placeholder="搜索作品或创作者" maxlength="80">
      <select name="kind" aria-label="作品类型"><option value="">全部作品</option><option value="video">视频</option><option value="gif">GIF 动图</option></select>
      <button>搜索</button>
    </form>
    <p id="showcaseStatus" role="status">正在读取作品…</p>
    <div id="showcaseContent"></div>
    <button type="button" id="showcaseMore" hidden>加载更多</button>
  </main>
<script src="/static/shared/i18n.js?v=1"></script>
</body>
</html>
